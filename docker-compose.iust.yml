services:
  prairielearn:
    image: prairielearn/prairielearn:latest
    container_name: iust_prairielearn
    ports:
      - "${PL_PORT:-3080}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/pl_ag_jobs:/jobs
      - ./courses/iust-bp:/course
      - ./apps/prairielearn/src:/PrairieLearn/apps/prairielearn/src
      - ./apps/prairielearn/public/images:/PrairieLearn/apps/prairielearn/public/images
      - pl_postgres_data:/var/postgres
    environment:
      - HOST_JOBS_DIR=${HOME}/pl_ag_jobs
      - DOCKER_HOST=/var/run/docker.sock
      - DEV=true
      - PL_BRAND_NAME=${PL_BRAND_NAME:-سامانه جامع ارزیابی و یادگیری هوشمند دانشگاهی}
      - PL_BRAND_SHORT_NAME=${PL_BRAND_SHORT_NAME:-سامانه یادگیری هوشمند}
      - PL_ANNOUNCEMENT_COLOR=${PL_ANNOUNCEMENT_COLOR:-info}
      - PL_ANNOUNCEMENT_HTML=${PL_ANNOUNCEMENT_HTML:-سامانه جامع آموزش، یادگیری و ارزیابی هوشمند دانشگاهی}
    extra_hosts:
      - 'host.docker.internal:172.17.0.1'
    restart: unless-stopped

volumes:
  pl_postgres_data:
