services:
  smart_homework:
    image: smart-homework:prod
    container_name: smart_homework
    restart: always
    cpus: "4.0"
    mem_reservation: 1g
    mem_limit: 3g
    oom_score_adj: -500
    pids_limit: 512
    ports:
      - "127.0.0.1:3000:3000"
      - "192.168.1.192:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/pl_ag_jobs:/jobs
      - /opt/smart-homework/courses/iust-bp:/course
      - /opt/smart-homework/courses:/data1/courses
      - /opt/smart-homework/ssh:/root/.ssh
      - /opt/smart-homework/files:/files
      - /opt/smart-homework/config.json:/PrairieLearn/config.json
      - smart_homework_db:/var/postgres
    environment:
      - HOST_JOBS_DIR=/root/pl_ag_jobs
      - DOCKER_HOST=/var/run/docker.sock
      - NODE_ENV=production
      - PL_BRAND_NAME=سامانه جامع ارزیابی و یادگیری هوشمند دانشگاهی
      - PL_BRAND_SHORT_NAME=سامانه یادگیری هوشمند
      - PL_PORTAL_URL=https://homework.atomathix.ir
    extra_hosts:
      - "host.docker.internal:host-gateway"

  workspace_host:
    image: smart-homework:prod
    container_name: workspace_host
    restart: always
    cpus: "1.0"
    mem_reservation: 256m
    mem_limit: 768m
    oom_score_adj: -200
    pids_limit: 256
    network_mode: "service:smart_homework"
    depends_on:
      smart_homework:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/pl_ag_jobs:/jobs
      - /opt/smart-homework/config.json:/PrairieLearn/config.json
    environment:
      - HOST_JOBS_DIR=/root/pl_ag_jobs
      - NODE_ENV=production
    command: ["node", "/PrairieLearn/apps/workspace-host/dist/interface.js"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  smart_homework_db:
